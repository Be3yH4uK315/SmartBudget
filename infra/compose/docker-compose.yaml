services:
  api_gateway:
    image: nginx:alpine
    container_name: api_gateway
    environment:
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "${API_GATEWAY_HOST_PORT}:80"
    volumes:
      - ./../nginx/nginx.conf:/etc/nginx/nginx.conf.source:ro
    command: >
      sh -c "envsubst '$$FRONTEND_URL'
      < /etc/nginx/nginx.conf.source
      > /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      auth_service:
        condition: service_healthy
      class_service:
        condition: service_healthy
      transactions_service:
        condition: service_healthy
      budgets_service:
        condition: service_healthy
      goals_service:
        condition: service_healthy
      notification_service:
        condition: service_healthy
    networks:
      - smartbudget-net

  redis_cache:
    image: redis:7
    container_name: redis_cache
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data_cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
      timeout: 5s
    restart: unless-stopped
    networks:
      - smartbudget-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    env_file:
      - ../env/infra.env
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}
    ports:
      - "${ZOOKEEPER_HOST_PORT}:2181"
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 2181 || exit 1"]
      interval: 5s
      retries: 5
      timeout: 2s
    restart: unless-stopped
    networks:
      - smartbudget-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    env_file:
      - ../env/infra.env
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
      ALLOW_PLAINTEXT_LISTENER: ${ALLOW_PLAINTEXT_LISTENER}
    ports:
      - "${KAFKA_HOST_PORT}:9092"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      retries: 10
      timeout: 3s
    restart: unless-stopped
    networks:
      - smartbudget-net

  auth_postgres:
    image: postgres:16
    container_name: auth_postgres
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    ports:
      - "${AUTH_POSTGRES_HOST_PORT}:5432"
    volumes:
      - pg_data_auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER}"]
      interval: 5s
      retries: 10
      timeout: 5s
    networks:
      - smartbudget-net

  auth_service:
    build:
      context: ../..
      dockerfile: services/authentification/Dockerfile
    env_file:
      - ../env/infra.env
      - ../env/auth.env
    container_name: auth_service
    ports:
      - "${AUTH_SERVICE_HOST_PORT}:8000"
    depends_on:
      auth_postgres:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ../../services/authentification:/app
      - ../../services/authentification/certs:/app/certs
      - ../../services/authentification/certs:/run/secrets:ro
      - ../../shared/python:/shared/python:ro
    environment:
      PYTHONPATH: /app:/shared/python
    restart: unless-stopped
    command: >
      sh -c "
        alembic upgrade head &&
        gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/auth/health/ready"]
      interval: 10s
      retries: 3
      timeout: 5s
    networks:
      - smartbudget-net

  auth_worker:
    build:
      context: ../..
      dockerfile: services/authentification/Dockerfile
    env_file:
      - ../env/infra.env
      - ../env/auth.env
    container_name: auth_worker
    depends_on:
      auth_service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    volumes:
      - ../../services/authentification:/app
      - ../../services/authentification/certs:/app/certs
      - ../../services/authentification/certs:/run/secrets:ro
      - ../../shared/python:/shared/python:ro
    environment:
      PYTHONPATH: /app:/shared/python
    command: arq app.workers.main.WorkerSettings
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "find /tmp/healthy -mmin -1 | grep -q ."]
      interval: 20s
      retries: 3
    networks:
      - smartbudget-net

  class_postgres:
    image: postgres:16
    container_name: class_postgres
